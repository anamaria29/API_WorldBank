<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Global Insights</title>

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Archivos estáticos servidos desde public/ por Vercel -->

    <link rel="stylesheet"
          href="css/styles.css">

</head>

<body>

<header>

    <div class="logo">

        <i class="bi bi-globe-americas-fill"></i>

        <div>

            <h1>Global Insights</h1>

            <span>World Bank Dashboard</span>

        </div>

    </div>

    <button id="themeToggle" type="button" aria-label="Cambiar tema" aria-pressed="false">

        <i class="bi bi-moon-stars"></i>

    </button>

</header>



<section class="hero">

    <h2>

        Compare indicadores económicos y sociales entre países

    </h2>

    <p>

        Utilice datos oficiales del Banco Mundial para analizar
        el desempeño económico y social de cualquier país.

    </p>

</section>

<p id="status" class="status" role="status" aria-live="polite"></p>



<section class="filters">

    <div class="filter-card">

        <div class="field">

            <label for="country1">

                País 1

            </label>

            <select id="country1"></select>

        </div>

        <div class="field">

            <label for="country2">

                País 2

            </label>

            <select id="country2"></select>

        </div>

        <button id="compareBtn">

            <i class="bi bi-search"></i>

            Analizar comparación

        </button>

    </div>

</section>



<!-- KPIs -->

<section class="cards">

    <div class="card">

        <div class="icon">

            <i class="bi bi-people"></i>

        </div>

        <h3>Población</h3>

        <div
            id="population"
            class="value">

        </div>

    </div>



    <div class="card">

        <div class="icon">

            <i class="bi bi-currency-dollar"></i>

        </div>

        <h3>PIB</h3>

        <div
            id="gdp"
            class="value">

        </div>

    </div>



    <div class="card">

        <div class="icon">

            <i class="bi bi-graph-up-arrow"></i>

        </div>

        <h3>PIB per cápita</h3>

        <div
            id="gdpPerCapita"
            class="value">

        </div>

    </div>



    <div class="card">

        <div class="icon">

            <i class="bi bi-heart-pulse"></i>

        </div>

        <h3>Esperanza de vida</h3>

        <div
            id="life"
            class="value">

        </div>

    </div>

</section>



<footer>

    <p>

        Global Insights · Powered by World Bank API

    </p>

</footer>



<script src="js/app.js"></script>

</body>

</html>
