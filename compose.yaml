services:
  api:
    build:
      context: .
    ports:
      - "127.0.0.1:5000:5000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    # Esta variante ya está preparada para ejecutarse sin usuario root.
    image: nginxinc/nginx-unprivileged:1.29-alpine
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /tmp:size=1m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
