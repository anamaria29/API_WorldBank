[project]
name = "global-insights"
version = "1.0.0"
description = "Dashboard para comparar indicadores del Banco Mundial"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask==3.1.3",
    "requests==2.34.2",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "--strict-markers --cov=backend --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["backend/venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.bandit]
exclude_dirs = ["backend/tests", "backend/venv"]
